# AnimePv-promt Visual Component Library — Expression
# 两种风格覆盖：冷系（cool / elegant / villain）与甜系（sweet / idol / shy）
#
# prompt_block 默认为女性向（沿用实证案例用词）。
# 男性/中性角色请使用 gender_neutral_prompt_block。
# 由 BM-04 暴露的 Issue-03 引入：Composer 须依 character_dna 性别择一注入。

components:
  - id: expression.cool.gaze.v1
    slug: cool-gaze
    name: Cool Gaze
    purpose: establish character attitude
    emotion: [cold, confident]
    face: [sharp eyes, neutral mouth]
    best_for: [cool female, warrior, queen]
    prompt_block: >
      anime female character cool sharp gaze,
      confident cold expression,
      direct eye contact
    gender_neutral_prompt_block: >
      anime character cool sharp gaze, confident cold expression, direct eye contact
    risk: low
    stability_score: 10
    impact_score: 9

  - id: expression.confident.smirk.v1

    slug: confident-smirk
    name: Confident Smirk
    purpose: personality moment
    emotion: [confident, teasing]
    face: [slight smirk, narrowed eyes]
    best_for: [cool female, cyber female, punk girl]
    prompt_block: >
      anime female character confident smirk,
      subtle teasing expression
    gender_neutral_prompt_block: >
      anime character confident smirk, subtle teasing expression
    risk: low
    stability_score: 9
    impact_score: 9

