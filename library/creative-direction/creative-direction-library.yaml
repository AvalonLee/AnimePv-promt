creative_directions:
  - id: kinetic_peak
    name_zh: 动作爆发
    emotional_goal: 紧张、兴奋、力量释放
    visual_focus: 动作方向、命中瞬间、速度反差
    energy_shape: high_open-rise-climax-settle
    compatible_strategies: [action_burst, ability_showcase]
  - id: emotional_closeup
    name_zh: 情绪特写
    emotional_goal: 共情、克制、情绪转折
    visual_focus: 眼神、呼吸、微表情和距离变化
    energy_shape: quiet-build-turn-hold
    compatible_strategies: [emotional_showcase, story_scene]
  - id: mystical_reveal
    name_zh: 神秘揭示
    emotional_goal: 好奇、敬畏、逐层发现
    visual_focus: 剪影、符号、能力和身份揭示
    energy_shape: conceal-reveal-rise-release
    compatible_strategies: [ability_showcase, poster_motion, story_scene]
  - id: relationship_tension
    name_zh: 关系张力
    emotional_goal: 对抗、默契、距离变化
    visual_focus: 角色位置、视线、动作呼应和同框关系
    energy_shape: separate-contrast-meet-resolve
    compatible_strategies: [relationship_interaction, story_scene]
  - id: graphic_identity
    name_zh: 图形化角色印象
    emotional_goal: 鲜明、时髦、强记忆点
    visual_focus: 角色剪影、色块、符号和图形匹配
    energy_shape: hook-pattern-escalate-freeze
    compatible_strategies: [poster_motion, emotional_showcase]

selection_rules:
  - 必须根据角色固定特征和用户想达到的画面效果选择
  - 只能选择一个主要创意方向，可附加一个次要方向
  - 创意方向不能覆盖角色身份锁定和内容类型风险上限
  - 不使用投放、转化、稀有度或活动目标进行选择

# 关键词提示（映射自主线 variation-selector，去商业化重构）：
# 用于快速匹配用户意图到创意方向；命中即作为候选，仍需通过 selection_rules 复核。
keyword_hints:
  - keywords: [皮肤, 时装, 新造型, outfit, 换装]
    direction: graphic_identity
  - keywords: [战斗, 技能, 强度, 动作, combat, ability]
    direction: kinetic_peak
  - keywords: [剧情, 故事, 情感, 回忆, story, emotional]
    direction: emotional_closeup
  - keywords: [神秘, 揭示, 蜕变, 觉醒, reveal, transformation]
    direction: mystical_reveal
  - keywords: [双人, 三人, 互动, 并肩, 关系, duo, trio, ensemble]
    direction: relationship_tension
  - keywords: [上线, 新角色, 展示, 介绍, release, showcase]
    direction: graphic_identity
default_keyword_direction: graphic_identity

# 校验规则（映射自主线 variation-validator，去商业化重构）：
# 创意方向选择须满足以下三条硬性校验，不满足即重选。
validation_rules:
  rule_01:
    title: 角色 DNA 不可破坏
    detail: 创意方向只改变展示角度/镜头语言/情绪方向，角色 DNA 保持 100% 锁定
    reference: core/character-dna/dna-lock-rules.md
  rule_02:
    title: 创意方向必须符合角色
    example_error: 暗黑魔女 + 甜系偶像换装展示
    detection: { compatibility: LOW }
    action: auto_adjust
  rule_03:
    title: 创作意图一致
    example_error: 目标为能力爆发展示，却输出纯剧情慢镜头
    action: reselect_direction
