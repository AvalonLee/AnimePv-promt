  original_prompt: 'SD2.5白模素材提示词

    热门白模视频转白模视频提示词：

    白模提示词：请以我上传的参考视频，完美复刻原视频的人物站位、舞蹈动作、节奏卡点、运动轨迹、队形变化和

    镜头构图。人物形象全部使用 3D 动画制作中的基础红白模形象：无脸、无五官、无头发、无服装、无纹理、无真

    实皮肤，只保留简洁的人形身体结构和清晰关节。动作必须严格跟随参考视频：红模完全复刻原视频中央主角的全

    部动作，包括脚步、抬手、摆臂、身体倾斜、弹跳、重心变化、转向、停顿和定格姿势。所有白模配角完全复刻原

    视频中对应人物的动作、站位、前后层次、左右分布、移动轨迹和节奏。每个动作的起始时间、落点、强拍定格和

    节奏变化都要与原视频尽可能一致。


    白模素材生成真人写实风格提示词：

    参考 （爆火原视频） 的运镜、景别、镜头节奏、音乐卡点和舞蹈编排，使用（主角图片）作为 C 位男主，保持人物外貌、发型、身材和气质高度一致，高度还原原视频中男主的全部舞蹈动作与节奏；周边伴舞替换成
    （舞伴合照），场景参考（场景图）同步匹配原视频伴舞的动作、站位和队形变化。动作丝滑流畅，运镜流畅不卡顿。角色动作严格按照视频里的。写实真人质感，好莱坞动作音乐大电影。融合好莱坞歌舞动作大片的镜头语言，动作丝滑流畅，运镜稳定顺滑，节奏精准卡点。不要
    BGM'
