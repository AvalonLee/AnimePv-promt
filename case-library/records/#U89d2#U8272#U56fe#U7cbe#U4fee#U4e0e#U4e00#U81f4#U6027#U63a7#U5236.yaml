input:
  original_prompt: '五大词转绘精修提示词

    一《人物真实感提示词》

    保留人物原有五官特征与面部比例，仅做肤色均匀优化，保留真实皮肤肌理，超写实质

    感，可见毛孔细纹，轻微淡化痘印瑕疵，呈现自然真实肤质，杜绝假脸感。

    二《主体无痕去除提示词》

    移除图中主体的元素及其阴影、反光和所有相关投影。主体原位置需根据周边环境自然填补 (如延伸背景

    图案、延续材质纹理或还原原始表面)，不留任何删除痕迹。画面中所有其他元素在位置、形状、色彩、细

    节等方面需 100% 保持不变。背景不变

    三《角色设定卡提示词》

    竖版韩系偶像角色设定卡，character profile，极简杂志风排版，纯白无影背景，高级轻奢版式，细分割线，信息模块化分区

    顶部是超大衬线字体英文姓名标题，搭配中英文文艺标语，右上角标注编号 No.07

    上半部分三栏布局：

    左栏是基础信息区，标注姓名、职业、年龄、身高、生日、星座、外貌特征、气质关键词与星级评分

    中栏是人物三视图，同一人物外貌描述的年轻男生，身穿【具体服装描述】，标准站姿，分别展示正面、正侧面、背面全身立绘，韩系爱豆颜值，精致五官，皮肤通透，身材纤长比例优越

    右栏是 6 格表情头像，同一人物的大头肖像，分别呈现平静、微笑、眨眼、认真、惊讶、思考六种表情，妆容统一

    下半部分四栏布局：

    第一栏服装拆解平铺展示整套穿搭的所有单品，白底整齐排列

    第二栏配饰展示，陈列耳饰、项链、发饰等搭配小件

    第三栏细节特写，4 张小图分别展示眼睛、嘴唇、发丝、服装面料细节

    第四栏配色色卡，垂直排列的色块附带十六进制色号，提取整套造型的主题配色

    底部三栏：中英文人物介绍文案、圆角矩形关键词标签、手写体英文签名附小字标语

    柔和无影棚光，均匀打光，超写实摄影质感，高清细节，8k，极致清晰，整体色调统一

    四《3D国漫转真人提示词》

    必须精准保留原动漫图片中的人物身份特征、脸部轮廓、五官比例、样貌气质、发型的写实摄影质感。 人

    物要求：将动漫人物转化为真实存在的人类形象，脸部必须具有真实的人类骨骼结构、自然面部轮廓、真

    实但好看的五官比例、真实皮肤质感、自然肤色、细腻的皮肤纹理、真实眼睛反光、真实睫毛和眉毛细

    节。保留原图人物的脸型特征、五官气质和整体样貌印象，但不要保留任何二次元夸张比例，不要动漫大

    眼，不要塑料感，不要 AI 假脸。 皮肤要求：皮肤必须呈现真实摄影级别质感，但整体状态要偏细腻、

    嫩、干净、自然、有轻微通透感，不要粗糙，不要颗粒过重，不要毛孔夸张，不要老化感，不要蜡像感，

    也不要过度磨皮。皮肤纹理要清晰但克制，属于高质量年轻肌肤的真实质感；细腻、平滑、柔和、富有弹

    性，保留轻微真实纹理与自然明暗起伏。除非原角色本身设定明显年龄较大，否则不要生成成熟粗糙、松

    弛、厚重或沧桑的皮肤状态。 发型要求：发型必须完全参考原动漫图的长度、刘海、发丝走向、层次、卷

    度、蓬松感和颜色，将其转化为现实中的真实头发质感。头发要有真实发丝细节、自然光泽、柔软蓬松感

    和真实物理垂坠感，不要像假发，不要僵硬，不要动漫块状头发。 服装要求：服装必须严格参考原动漫图

    的款式、剪裁、颜色、图案、材质、装饰细节和穿着方式风格。 画面风格：极致写实摄影风格，真实世界

    照片质感，电影级真实光影，高动态范围，真实镜头景深，真实空气感，真实环境反射，细节清晰，高分

    辨率，8K 超清，专业摄影构图。整体效果必须像现实世界中真实拍摄的人像照片，而不是动漫、插画、

    游戏 CG 或 3D 角色渲染图。 构图要求：保持原图的画面构图、人物大小、镜头角度、景别、透视关系和

    主体位置。高清真实摄影效果。 禁止内容：禁止动漫风、插画风、二次元风、3D 卡通风、游戏 CG 风、

    塑料皮肤、假人感、过度磨皮、皮肤粗糙过度、毛孔夸张、老化感过强、眼睛颜色错误、虹膜颜色偏差、

    五官变形、眼睛过大、脸部模糊、手指畸形、肢体扭曲、服装细节丢失、场景随意更换、背景虚假、光线

    不统一、明显 AI 感、低清晰度、过度美颜、过度锐化。

    五《人物一致性提示词》

    变体动作与表情：

    1. 正面轻笑，微微露齿，眼神自信。

    2. 看向镜头，嘴唇轻抿，神情明艳但克制。

    3. 一只手轻碰嘴唇，带一点时装俏皮感。

    4. 头部轻微侧转，眼神看向镜头外，像拍杂志抓拍。

    5. 手掌轻贴脸侧，笑容自然，面部肌肉真实。

    6. 头轻轻歪向一侧，眼神柔和，带一点甜酷感。

    7. 轻微张嘴，目光松弛，像高定广告定格。

    8. 抬手整理头发或挡光，姿态放松，神情高级。

    重点：保持同一位模特，同一张脸，同一眼型与唇形，同一发型轮廓，同一肤色和肤质，不跑脸，不换脸，不幼态化。'
