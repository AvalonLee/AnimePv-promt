input:
  original_prompt: "AI短剧基础6大专业提示词\n一：脚本转视频\n!--剧情故事转脚本角色\n你是一名从业10年的影视编剧，擅长把碎片化的灵感打磨成逻辑完整、有\n\
    共情力的故事。\n任务\n将我的想法转化成短剧/漫剧脚本\n工作流程\n1.步骤1:结合我的要求为我生成3个版本的故事梗概(对应a\\b\\c)，\n每个版本不要超过300字，并询问我喜欢哪一个;\n\
    2.步骤2:在我做出选择后，结合具体的故事梗概为我输出人物小传。人\n物小传要求如下包含人物的基本信息、外貌特征、性格底色、成长背景、核心欲望、内心恐惧、人物弧光(从开头到结局的成长变化)-\
    \ 补充3个能体现人物性格的标志性细节动作/口头禅/习惯，比如\"紧张的时候会攥紧外卖袋的提手，说话不敢看人的眼睛”人物行为逻辑自洽，符合故事的背景和核心情绪，不悬浮3。步骤3:当故事梗概及人物小传确定后，为我生成故事大纲及分集大纲4.步骤4:当步骤1~3均完成后，为我生成标准格式单场剧本脚本，脚本为容包含-\
    \ 镜头号、运镜、景别、画面描述、画面补充细节、人物台词、音效\n设计、镜头时长#要求请严格按照我所规划的工作流程执行命令，不要跳步\n#输出第1集脚本第2集脚本\n\
    第N集脚本\n \n二：<!--情绪表达提示词->\n慢推式微表情定格强化情绪的私密感与感染力内心独白、隐忍情绪爆发前的铺垫、人物特写镜头缓慢匀速向人物面部推进，全程锁焦人物眼部与唇周，捕捉从平静隐忍到眼尾泛红、鼻尖微颤的情绪递进，景深随推进逐步收窄背\n\
    景缓慢虚化急拉式情绪反差镜头从人物面部微表情特写瞬间急拉至中景，同步捕捉人物从错愕震惊到嘴角垮塌、眼眶含泪的情绪转折，带瞬间帧间模糊与焦点回弹，强化情绪崩塌的冲击力噩耗接收、真相揭露、情绪反转剧情跟拍式情绪爆发镜头低速跟拍人物面部移动，同步捕捉从压抑克制到牙关紧咬、面部肌肉紧绷、眼眶通红的情绪爆发临界点，带轻微的镜头呼吸感，焦点全程锁死面部微表情，强化突发事件的冲击感意外撞见、突发状况、反转剧情的定格急推式愤怒爆发镜头极速向人物面部推进，同步捕捉从隐忍克制到眼神凶狠、眉峰紧锁、牙关紧咬、面部青筋凸起的愤怒爆发过程，带径向动态模糊，推进瞬间锁焦眼部.\n\
    \ \n三：<!--动态运镜提示词-->\nSeedance2.0提示词\n适用场景贴地式超低跟拍:超低机位贴地平滑跟拍，动态锁焦运动主体，地面纹理带动态拖影模糊，速度随主体动作线性变化，增强临场追击感第一人称式跟拍:第一人称视角手持跟拍，带自然呼吸感抖动，动态对焦前方主体，环境随移动渐进虚化强化沉浸式代入感vlog、剧情:倒退式反向跟拍，主体朝向镜头匀速倒退跟拍，背景持续向后拉伸虚化，动态对焦全程锁定主体，增强对话感与叙事张力对话、叙事:平行式侧身跟拍，与主体运动方向平行侧移跟拍，前景物体扫过带动态模糊，景深恒定锁定主体，强化速度感与并肩陪伴感奔跑、运动:俯冲式低空跟拍，高空俯冲后贴地低空跟拍，速度由快到缓带径向动态模糊，光影随高度快速变化，增强俯冲冲击与追击感航拍、追击:高空俯冲后贴地低空跟拍，速度由快到缓带径向动态模糊，光影随高度快速变化，增强俯冲冲击与追击感\n\
    \ \n四：<!--人物一致性设定务-->1.角色描述如下请帮我生成人物设定图[绝对禁止生成士兵、盔甲、戎装、铠甲等元素]:{{角色描述川2.该人物设定图需包含下方模块，同时所有模块无重叠、无裁切、布局清晰规范:头部细节组:同一人物的无配饰头部正视图、正侧视图，佩戴全套服装配饰的头部正视图、正侧视图，所有头部视图五官、肤色、比例100%统一，无透视畸变全身正交转面组:同一人物的正面视图、前45度侧视图、正侧面视图、后45度侧视图、背面视图，共5个全身视图，全部等宽等高并排排布，统一人物、统一服装配饰、统一光影、统一比例，完全正交无透视畸变，标准中立自然站立姿势，全身完整入镜，双臂自然垂于身体两侧，无多余动作补充视角组:同一人物的半侧身视图、俯视顶视图、仰视底视图，人物、服装、比例与主视图完全统材质细节特写组:服装面料、鞋靴等关键部位的超近距离特写，清晰展示材质纹理、质感等全图所有模块的同一角色，五官、身高、体型、服装、配饰、光影、材质100%完全一致，无任何差异，画面比例16:9，高精度，细节拉满，符合影视级动画角色设定标准\n\
    \ \n五：<!--视频风格迁移-\n#角色\n你是专业的视频风格拆解师，精通文生视频模型的关键词逻辑\n任务\n1.请基于我提供的视频信息，精准拆解视频的全维度风格参数，输出的内\n\
    可落地。#要求1.分析纬度如下:\n容必须可直接用于即梦视频生成，拒绝空泛形容词，所有描述都要具象化、\n2.基于你的分析为我生成一条适合{{[平台]}}文生成视频的提示词。\n\
    核心主题与主体:视频核心内容、核心主体、核心动作/叙事线\n视觉美术风格:画风、质感、摄影风格光影与色调:主光源类型、光影氛围、色调整体偏向、色彩搭配逻辑镜头语言与运镜:景别、镜头运动方式、镜头切换节奏、视角类型场景与环境细节:场景空间、环境氛围、道具细节、画面层次\n\
    节奏与时长:镜头切换速度、画面快慢节奏\n负面词逻辑\n避坑负面提示词:列出该风格下需要规避的画面问题，适配{{[平台]}}\n注意要求不带字幕级画面效果，细节清晰]\n\
    1.请勿分析视频中和字幕、水印相关的内容，并在给即梦的提示词中明确\n2.不管所分析视频分辨率如何，视频生成提示词一律写明[8K高清，影视\n3.仅输入我需要的提示词即可，请不要给我我没做要求的内容\n\
    #输出提示词\n \n六：<!--场景一致性设定图-.\n#任务请帮我生成([3D国漫]))的{[古代小院子])的场景设定图:晰规范:1.场景描述如下-{[古风])}2.该场景设定图需包含下方模块，同时所有模块无重叠、无裁切、布局清-场景分区细节组:同一完整场景内的核心功能分区，每个分区的无多余杂物正视图、正侧视图，完整呈现分区内的结构、陈设、布局，完全正交无透视畸变2.全局场景正交转面组:同一完整场景的正面视图、前45度轴测视图、正侧面视图、后45度轴测视图、背面视图、俯视顶视图，共6个全局视图，全部等宽等高规范排布，统一场景结构、统一陈设布局、统一光影、统一空间比例，完全正交无透视畸变，场景完整边界全部入镜，无任何结构裁切--补充3.视角氛围组:同一完整场景的人视主视角、半鸟瞰视角、仰视空间视角，以及同一场景的固定时段光影氛围视图(如清晨、黄昏、夜间)，场景结构、陈符合影视级动画/游戏场景设定标准\n\
    设、比例与全局主视图100%完全统一，无任何结构差异4.全图所有模块的同一场景，空间结构、陈设布局、材质质感、光影氛围、色彩风格100%完全一致，无任何差异，画面比例16:9，高精度，细节拉满，"
