benchmark:
  id: BM-13
  name: Neutral Character Concept Sheet
  dimension: concept-sheet
  status: PASS

purpose: >
  验证「角色概念分解图」资产（director/character-concept-sheet.md）与性别中立基础发布主题
  （character-release）的协同：非二元 / 中性角色沿用统一的六维框架与三桶命名，背景可在白底与
  羊皮纸间按气质二选一；全程继承 Base Style 锁定与角色 DNA 一致。dimension=concept-sheet
  标记为与 BM-11 / BM-12 对称的中性回归用例。

input:
  request: 制作一个中性气质新角色的概念分解图设定稿。银灰短发，琥珀瞳，中性穿搭（外套+内搭+阔腿裤），清冷而亲和，手游新角色发布。4:5设定图。
  session_spec:
    duration: 15s
    aspect_ratio: "4:5"

expected_routing:
  task: CREATE_PV
  character_type: neutral
  persona_tag: 中性
  genre: daily
  theme: character-release
  variation: release.standard.v1
  template: genre-daily-15s
  style_stack:
    base: modern-cel
    premium: mobile-game-premium

# 本用例核心交付：角色概念分解图资产被触发
output_assets:
  - character-concept-sheet

expected_components:
  camera: [reveal-closeup, beauty-showcase, hero-low-angle]
  action: [hand-gesture, ability-release, signature-pose]
  expression: [cool-gaze, sweet-smile]
  transition: [graphic-panel, ui-card, title-reveal]

risk_budget:
  max_action_level: 2
  max_effect_level: 2
  max_camera_transition: 9

scores:
  generation_stability: 35
  character_consistency: 25
  shot_feasibility: 18
  visual_impact: 10
  creative_intent_match: 10
  art_direction: 0
  final_score: 98
  decision: PASS

notes:
  - 概念分解图属 Step1 角色设定图 Prompt 的深度扩展，不替换角色圣经，仅以单图呈现六维
  - 中性 / 非二元角色背景在白底与羊皮纸间按气质二选一，仅限呈现层，线稿 / 光影仍服从 modern-cel，禁止 3D / PBR
  - 生活切片三桶采用跨性别通用示例（随身包袋 / 个护与配饰 / 个性化物件：手账本 / 收藏徽章 / 常备药品 / 明信片）
  - 评分结构与 BM-12（同 routing 族）一致，新资产不改变既有稳定性上限
