project:
  title: 风雪剑士
  duration: 5
  aspect_ratio: '16:9'
  content_type: action
  creative_intent: 展示拔剑爆发
character:
  summary: 银发蓝瞳剑士，黑银轻甲和深蓝披风
  immutable_features:
  - 银发
  - 蓝瞳
  - 黑银轻甲
  - 冰晶长剑
  allowed_variations:
  - 发丝和披风受风变形
cast:
  mode: single
  members:
  - id: lead
    role: 主角
  relationships: []
direction:
  creative_direction: kinetic_peak
  secondary_direction: mystical_reveal
  presentation_strategy: action_burst
  emotional_goal: 冷静蓄力后瞬间爆发
  visual_focus: 眼神、拔剑方向和冰晶命中
style:
  base_style: modern-cel
  visual_approach: cel_animation
  enhancements:
  - 冰晶拖影
  environment: 风雪山谷
  lighting: 冷蓝逆光
performance_direction:
  baseline: 角色正在执行与场景相关的具体任务
  stimulus: 环境或事件产生可感知变化
  reaction: 视线、手部和身体重心依次产生反应
  recovery: 角色完成反应并进入下一动作或收势
  lifelike_moments:
  - type: external_interruption
    description: 环境变化触发角色即时反应
  - type: motion_afterglow
    description: 主要动作结束后保留发丝或衣摆余韵
