key_learnings:
  - 图片 Prompt 与视频 Prompt 分离：先用 seedream5.0lite 定角色，再用 H3 做视频
  - 机位清单式列举比抽象描述更有效
  - 明确写"绝不允许连续两个镜头使用相同机位、相同构图或相同动作"
  - 安全边界必须显式声明（禁止走光/内衣外露/过度暴露/低俗）
  - 年龄边界必须显式声明（明确为年轻成年女性）

avoid: [普通淡入淡出, 空镜头, 慢节奏铺垫, 写实场景, 暖色电影光, 3D空间, 真实摄影质感, 动作重复, 角度重复]
