# 实证案例：平面海报式 / Editorial MG / 剪影符号化 PV
# 来源：PV 脚本 1_太刀城市 PV / PV 脚本 2_命运赌场 PV / PV 脚本 3_兔耳魔术师 PV（三份成功案例 prompt）
# 状态：可复用方法论（三案例同构，已抽象为通用规则）
# 关联：references/extracted-rules.md 第十二~十六类；SKILL.md §5 知识系统 / §6 方法 4

case_id: case.proven.editorial.mg.poster.v1
source: verified_success_case_prompts
style_family: editorial_mg_poster
compatible_models: [minimax-h3, sora, pika, kling]
duration: 20s
aspect_ratio: "16:9"

# ─────────────────────────────────────────────
# 一、视觉基底（本风格不可妥协的硬约束）
# ─────────────────────────────────────────────
visual_core:
  base: >
    纯二维日系赛璐璐角色 + 抽象 Editorial MG 平面设计 + 游戏 UI 平面图层；
    所有人物、场景、道具、特效均平面化、剪影化、符号化、图形化，
    像一张「不断拆解、翻转、重组的动态平面海报」。
  forbidden_hard:
    - 不要 3D / 立体建模 / 三维透视渲染 / CG 质感
    - 不要真实空间纵深 / 景深 / 镜头穿越三维环境
    - 不要写实光影 / 真实材质 / 电影级真实透视
    - 不要连续写实打斗 / 复杂连续动作 / 真实摄影棚风格
    - 不要大面积霓虹灯 / 赛博朋克写实街景（除非主题明确需要赛博）
  layer_split:
    foreground: 贴纸/文字/粒子飞入，提供速度感与即时信息
    midground: 人物关键姿态与表情表演（相对稳定）
    background: 平面图形脉冲/旋转/反向滚动，提供节奏与重组感
  risk_control: >
    角色占比约 70% 且相对稳定（关键姿态定格+侧面平移），
    背景 Graphic 高速运动并反向滚动 —— 控制生成风险同时维持冲击。

# ─────────────────────────────────────────────
# 二、三色高反差 + 色彩语义系统
# ─────────────────────────────────────────────
color_system:
  principle: 颜色不仅用于审美，更承载叙事语义；全片三色高反差锁定。
  palettes:
    tachi_city:     { red: 猩红, white: 纯白, black: 黑, note: 红=反杀/高危情绪符号 }
    fate_casino:    { red: [深红, 猩红, 酒红], white: 纯白, black: 黑, note: 红=情绪/危险/欲望, 白=规则/命运, 黑=未知/压迫 }
    rabbit_magician: { red: 红, white: 纯白, black: 黑, accent: [高饱和粉彩渐变, 虹色反光, 逆光半透明], note: 米山舞风，红黑白骨架+粉彩软涂 }
  rule: 选定三色后全片不漂移；红色只用于高危/反杀/情绪触发帧，平时克制。

# ─────────────────────────────────────────────
# 三、世界符号库（每主题一套固定 2D 图形原语，重组复用）
# ─────────────────────────────────────────────
symbol_kits:
  tachi_city:     [时钟刻度, 圆环, 月相, 扑克牌, 扫描线, 网点, 几何切片, 管道, 空调外机, 窗框, 电线, 高楼轮廓]
  fate_casino:    [红色赌桌, 黑白扑克, 圆形筹码, 骰子图标, 概率刻度, 游戏UI框线, 几何色块, 网格, 斜线]
  rabbit_magician: [怀表刻度, 魔术圆环, 月相, 扑克牌, 兔子符号, 小丑笑脸, 扫描线, 网点, 剧院幕布, 棋盘地面, 魔术机关]
  common: [网格, 几何切片, 斜向遮罩, 黑白反相, 单帧闪红/闪白]
  rule: 城市/空间不表现真实建筑，只保留符号骨架；所有元素像海报图层相互覆盖/切割/重组。

# ─────────────────────────────────────────────
# 四、核心手法：剪影 ↔ 赛璐璐 瞬时切换（登场/揭示）
# ─────────────────────────────────────────────
silhouette_cel_morph:
  pattern: 角色从「黑色剪影 → 纯白剪影 → 二维赛璐璐形象」逐段揭示
  trigger: 镜头沿武器/法器杆向上移动时分面揭示；脚步/魔杖尖端划过留几何轨迹
  value: 用图形语言完成登场，规避写实登场动作的生成风险
  usage: 0-6s 开场固定使用，建立角色识别度

# ─────────────────────────────────────────────
# 五、镜头切换方法论（图形匹配转场，非淡入淡出）
# ─────────────────────────────────────────────
transition_methodology:
  core: 转场依靠「形状/图形匹配」完成，禁止普通淡入淡出与空白过渡
  shape_match_examples:
    - 人物剪影遮罩切换
    - 刀刃/魔杖形色块斜向划像
    - 扑克牌翻面 / 绽放膨胀为铺满画面的抽象色块
    - 骰子/筹码轮廓碎裂成几何切片
    - 月亮收缩成白色圆点 → 匹配转场为反派手中筹码
    - 兔子符号 / 小丑面具形状匹配
    - 黑白反相 / 单帧闪红闪白 / 镜面碎裂
  inventory: [剪影遮罩, 武器形色块, 斜向遮罩, 图形匹配, 黑白反相, 单帧闪红, 单帧闪白, 镜面碎裂, UI圆环, 几何划像]
  forbidden: [普通淡入淡出, 空白过渡, 无理由黑场]

# ─────────────────────────────────────────────
# 六、分镜节奏结构（20s 范式，可缩放）
# ─────────────────────────────────────────────
storyboard_structure:
  open_0_3s:   局部开场（只展示下半身/脚步/靴/武器局部）+ 图形向外弹开 + 武器划出几何轨迹
  reveal_3_6s: 沿武器上移分面揭示角色，剪影↔赛璐璐切换，背景符号动态拼合
  walk_6_9s:   角色侧面平移，背景反向滚动；巨大图形圆环展开斜切画面；眼睛特写框
  montage_9_15s: 扑克牌/符号掠过→某张膨胀为色块；进入 MG 蒙太奇，关键姿态定格，不连续动作
  villain_15_20s: 反派私人空间终场揭示 + 标题由图形拼合 + 英文副标题
  beat_sync: 每次鼓点/魔术触发 → 反相 / 单帧闪红闪白 / 几何拆解
  eye_macro: 眼睛特写内部不是现实倒影，而是由世界符号（扑克/筹码/兔子/刻度）组成的二维图层

# ─────────────────────────────────────────────
# 七、反派终场揭示模板（Villain Reveal at End）
# ─────────────────────────────────────────────
villain_reveal_template:
  space: 反派私人二维空间（剧场/酒吧/魔术台），仅由强平面色块构成
  pose: 二郎腿坐/转筹码/玩弄道具，从容危险
  shot: 极近特写；红色液体在玻璃杯旋转，杯面倒映女主剪影
  focus: 几何圆环移动到反派面部，从帽檐阴影抬眼，露出从容而危险的微笑
  title: 原创标题由（主题符号）重新拼合，下方英文副标题
  examples:
    - { script: 太刀城市, title: "BEYOND THE MIRROR" }
    - { script: 命运赌场, title: "FINAL BET", subtitle: "PLAY YOUR FATE" }
    - { script: 兔耳魔术师, title: 由怀表刻度+魔术棒+兔耳+几何切片拼合 }

# ─────────────────────────────────────────────
# 八、动态负向约束清单范式（必写，比模糊 high quality 更有效）
# ─────────────────────────────────────────────
negative_prompt_paradigm:
  pattern: 每个 PV 末尾单列「严格限制」段，枚举禁止项而非只写期望
  must_include:
    - 全片纯二维平面动画（不要3D/立体/真实空间/CG渲染/三维建模）
    - 不要真实建筑/真实赌场/真实摄影棚
    - 不要电影级光影/景深/真实材质
    - 不要连续写实打斗/复杂连续动作
    - 不要大面积霓虹灯/赛博朋克写实街景（除非主题需要）
    - 所有元素平面化/图形化/插画化，像动态平面海报
  note: 负向约束应颗粒化、可判定，避免「高质量」「精美」等不可执行形容词。

# ─────────────────────────────────────────────
# 九、音乐/音效设定（作为一等输入，驱动节奏）
# ─────────────────────────────────────────────
audio_design:
  principle: BPM/曲风/乐器/音效/节奏变化需独立成节，分镜绑定鼓点
  example_fate_casino:
    bpm: 132
    genre: 暗调日系 Electro Rock（电子鼓+低沉Bass+碎拍+冷感钢琴+机械节奏+女声哼唱）
    sfx: [扑克牌摩擦, 骰子滚动, 筹码碰撞, 洗牌声]
    arc: 开场只有摩擦/骰子/筹码声+低频脉冲 → 8s 鼓点进入渐快 → 结尾随最后一张牌翻开突然停止

# ─────────────────────────────────────────────
# 十、关键可复用经验（key learnings）
# ─────────────────────────────────────────────
key_learnings:
  - 平面海报式 PV 的本质是「角色相对稳定 + 背景 Graphic 高速反向运动 + 图形匹配转场」，而非连续动作叙事
  - 剪影↔赛璐璐瞬时切换是低成本建立角色识别度、规避登场动作风险的黄金手法
  - 三色高反差须配色彩语义（红=危险，白=规则，黑=未知），颜色即叙事
  - 世界由固定 2D 符号原语集构成，重组复用即可生成无限海报感画面
  - 转场一律图形匹配（形状/符号/反相），彻底放弃淡入淡出
  - 眼睛/手部/武器局部特写内部嵌套世界符号图层，强化角色与世界观绑定
  - 反派终场揭示 + 标题图形拼合是 20s PV 的标准收口结构
  - 负向约束必须颗粒化枚举（禁止项清单），这是控制 AI 漂移的最有效手段
  - 音乐/音效设定应作为一等输入，鼓点直接驱动闪红/反相/几何拆解
  - 角色每次重新出现必须改变机位/构图/动作，避免站桩（与 extracted-rules 一 一致）

# ─────────────────────────────────────────────
# 十一、每脚本差异化变体（同构不同皮）
# ─────────────────────────────────────────────
variants:
  tachi_city:
    theme_world: 城市（管道/窗框/电线/高楼轮廓）
    hero_weapon: 接近身高的大太刀
    accent_visual: 红白反相 + 单帧闪红 + 几何拆解
    semiotics: 时钟/月相/扑克
  fate_casino:
    theme_world: 命运赌场（扑克/筹码/骰子/概率刻度）
    hero_prop: 一张扑克牌
    accent_visual: 红白黑几何重组 + 平面UI文字(FINAL ROUND/RISK REWARD)
    semiotics: 概率/规则/命运
  rabbit_magician:
    theme_world: 都市奇幻魔术剧场（幕布/棋盘/魔术机关/怀表）
    hero_weapon: 接近身高的黑色魔杖
    accent_visual: 高饱和粉彩渐变+虹色反光+镜面碎裂+米山舞风
    semiotics: 兔子/小丑/魔术圆环
    spatial_freedom: 允许不合理倾斜/翻转/压缩/镜像错位/透视变形（与前两者「禁止透视变形」相反）

search_tags: [平面海报式, Editorial MG, 剪影符号化, 图形匹配转场, 三色高反差, 反派终场揭示, MG蒙太奇, 动态负向约束, 实证案例]
